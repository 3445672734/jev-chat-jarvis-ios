name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: Regenerate project (optional)
        run: |
          brew install xcodegen >/dev/null 2>&1 || true
          xcodegen generate || echo "::warning::xcodegen failed, using committed xcodeproj"

      # Xcode 16 / iOS 18.5 SDK rejects ad-hoc signing: archive unsigned,
      # then add ad-hoc signature + entitlements (App Group) via codesign CLI.
      - name: Archive (unsigned)
        run: |
          mkdir -p build
          ARCHIVE="$PWD/build/JevJarvis.xcarchive"
          ARGS=(
            -project JevJarvis.xcodeproj -scheme JevJarvis -configuration Release
            -sdk iphoneos -destination "generic/platform=iOS"
            -archivePath "$ARCHIVE" -derivedDataPath "$PWD/build/dd"
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""
            archive
          )
          set +e
          xcodebuild "${ARGS[@]}" > build/archive.log 2>&1
          XC=$?
          set -e
          tail -n 40 build/archive.log
          ls -la build || true
          if [ ! -d "$ARCHIVE/Products/Applications/JevJarvis.app" ]; then
            echo "::error::archive missing (xcodebuild exit $XC), see build-logs artifact"
            exit 1
          fi

      - name: Ad-hoc sign with entitlements
        run: |
          set -uo pipefail
          APP="build/JevJarvis.xcarchive/Products/Applications/JevJarvis.app"
          sign() {
            local bundle="$1" ent="$2"
            if [ ! -e "$bundle" ]; then echo "skip $bundle"; return 0; fi
            if [ -f "$ent" ]; then
              codesign --force --sign - --timestamp=none --entitlements "$ent" "$bundle" \
                && echo "ok: $bundle (+ entitlements)" \
                || echo "::warning::codesign failed: $bundle"
            else
              codesign --force --sign - --timestamp=none "$bundle" \
                && echo "ok: $bundle" || echo "::warning::codesign failed: $bundle"
            fi
          }
          sign "$APP/PlugIns/JevLive.appex"     Broadcast/JevLive.entitlements
          sign "$APP/PlugIns/JevKeyboard.appex" Keyboard/JevKeyboard.entitlements
          sign "$APP"                           App/JevJarvis.entitlements
          echo "--- app entitlements ---"
          codesign -d --entitlements :- "$APP" 2>&1 | head -30 || true
          codesign --verify --deep --strict "$APP" && echo "verify: ok" || echo "::warning::codesign verify failed (IPA still usable for re-sign)"

      - name: Package Payload/*.ipa
        run: |
          set -euo pipefail
          APP="build/JevJarvis.xcarchive/Products/Applications/JevJarvis.app"
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          echo "--- embedded extensions ---"
          ls -1 build/Payload/JevJarvis.app/PlugIns || true
          cd build && zip -qry JevJarvis-unsigned.ipa Payload
          ls -lh JevJarvis-unsigned.ipa
          unzip -l JevJarvis-unsigned.ipa | head -15

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JevJarvis-ipa
          path: build/JevJarvis-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/archive.log
          if-no-files-found: ignore
          retention-days: 7
